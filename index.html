<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌍 WORLD LIVE WALL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;background:#05050a;color:#fff}.header{position:fixed;top:0;width:100%;z-index:100;background:rgba(5,5,10,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.1);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:18px}.logo span{color:#00ff88}.live-badge{background:#ff0033;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}.free-banner{background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;padding:10px;text-align:center;font-weight:700;font-size:13px;position:fixed;top:53px;width:100%;z-index:99}.hero{margin-top:90px;padding:20px;text-align:center}.hero h1{font-family:'Syne',sans-serif;font-size:32px;line-height:.9;letter-spacing:-2px}.hero h1 .grad{background:linear-gradient(90deg,#00ff88,#00d4ff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.map{width:calc(100% - 32px);height:380px;background:radial-gradient(ellipse at center,#0a1a2a 0%,#05050a 70%);border:1px solid rgba(255,255,255,.1);border-radius:16px;margin:16px;position:relative;overflow:hidden}textarea{width:100%;background:#11111a;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px;color:#fff;font-size:15px}.btn{width:100%;padding:16px;background:linear-gradient(90deg,#00ff88,#00d4ff);color:#000;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:12px;cursor:pointer}.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between}.pin{position:absolute;background:#fff;color:#000;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;transform:translate(-50%,-100%)}</style>
</head>
<body>
<div class="header"><div class="logo">WORLD <span>LIVE</span> WALL</div><div class="live-badge"><span id="v">1,247 LIVE</span></div></div>
<div class="free-banner" id="banner">🎉 FREE FOR FIRST 60 MINUTES! <span id="t">60:00</span></div>
<div class="hero"><h1>YOUR MESSAGE<br><span class="grad">LIVE FOR THE WORLD</span></h1><p style="opacity:.7;font-size:14px;margin-top:12px">No algorithm. No followers. $2 = 60 seconds live on world map.</p></div>
<div class="map" id="map"></div>
<div style="padding:16px"><div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px"><h3>🔥 Drop your message</h3><textarea id="inp" maxlength="100" rows="3" placeholder="What should the world see?"></textarea><button class="btn" id="btn">🚀 POST LIVE - FREE NOW!</button></div><div style="margin-top:16px" id="list"></div></div>
<script>
let free=3600;let start=localStorage.getItem('ww')||Date.now();if(!localStorage.getItem('ww'))localStorage.setItem('ww',start);free=3600-Math.floor((Date.now()-parseInt(start))/1000);function upd(){if(free<=0){document.getElementById('banner').innerHTML='💰 $2 = 60 SECONDS LIVE';document.getElementById('btn').innerText='🚀 POST $2';return}let m=Math.floor(free/60),s=free%60;document.getElementById('t').innerText=m+':'+String(s).padStart(2,'0');free--}setInterval(upd,1000);
let msgs=JSON.parse(localStorage.getItem('m')||'[]');function add(text){let o={text,c:'🇰🇪',city:'Nairobi',time:Date.now()};msgs.push(o);localStorage.setItem('m',JSON.stringify(msgs));let p=document.createElement('div');p.className='pin';p.innerText=text;p.style.left=(20+Math.random()*60)+'%';p.style.top=(20+Math.random()*60)+'%';document.getElementById('map').appendChild(p);setTimeout(()=>p.remove(),60000);render()}
function render(){let l=document.getElementById('list');l.innerHTML='';msgs.slice(-10).reverse().forEach(m=>{let left=Math.max(0,60-Math.floor((Date.now()-m.time)/1000));if(left<=0)return;let d=document.createElement('div');d.className='card';d.innerHTML='<div>'+m.text+'</div><div style="font-size:10px;opacity:.5">'+left+'s</div>';l.appendChild(d)})}
document.getElementById('btn').onclick=()=>{let v=document.getElementById('inp').value.trim();if(!v)return;add(v);document.getElementById('inp').value='';document.getElementById('btn').innerText='✅ LIVE!';setTimeout(()=>document.getElementById('btn').innerText=free>0?'🚀 POST LIVE - FREE NOW!':'🚀 POST $2',2000)};
let demo=["Nairobi to world!","Hello Tokyo","Legends never die","Build in public","$2 for fame"];setInterval(()=>{if(Math.random()>.6){add(demo[Math.floor(Math.random()*demo.length)])}},3000);render();
</script>
</body>
</html>
